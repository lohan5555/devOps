services:
  bd:
    image: postgres:12
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: appdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - bd_data:/var/lib/postgresql/data

  server:
    build:
      context: .
    ports:
      - "3000:3000"
    depends_on:
      bd:
        condition: service_healthy

volumes:
  bd_data: